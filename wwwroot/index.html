<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Repo Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; } /* Slate 900 */
    </style>
</head>
<body class="text-gray-200 antialiased font-sans">

    <div class="max-w-7xl mx-auto p-6 md:p-10">
        
        <!-- =========================================
             1. AUTHENTICATION SECTION 
             ========================================= -->
        <div id="auth-section" class="max-w-md mx-auto mt-20 bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-700">
            <h2 id="auth-title" class="text-2xl font-bold text-white mb-6 text-center">Log In to Dashboard</h2>
            
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                    <input type="email" id="auth-email" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>
                
                <button type="submit" id="auth-button" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg transition">
                    Log In
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-400 border-t border-gray-700 pt-4">
                <span id="auth-toggle-text">Don't have an account?</span>
                <button onclick="toggleAuthMode()" class="text-indigo-400 hover:text-indigo-300 font-medium ml-1">
                    <span id="auth-toggle-link">Register</span>
                </button>
            </div>
        </div>

        <!-- =========================================
             2. MAIN DASHBOARD SECTION (Hidden by default)
             ========================================= -->
        <div id="dashboard-section" class="hidden">
            
            <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-5 border-b border-gray-800">
                <div>
                    <h1 class="text-3xl font-extrabold text-white tracking-tight">Git Repo Dashboard</h1>
                    <p class="text-sm text-gray-400 mt-1">Manage your private repository notes</p>
                </div>
                
                <div class="flex flex-wrap gap-3 items-center">
                    <!-- GitHub Search -->
                    <div class="flex gap-2 items-center bg-gray-900 p-1.5 rounded-lg border border-gray-800">
                        <input type="text" id="github-input" placeholder="username or user/repo" class="w-48 bg-transparent px-3 py-1.5 text-sm text-white focus:outline-none placeholder-gray-600">
                        <button onclick="importSingleRepo()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-sm font-medium transition">
                            Fetch Repo
                        </button>
                        <button onclick="importAllRepos()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3 py-1.5 rounded text-sm font-medium transition">
                            Fetch All
                        </button>
                    </div>

                    <!-- Add & Logout Buttons -->
                    <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg transition">
                        + Add Note
                    </button>
                    <button onclick="logout()" class="text-gray-400 hover:text-white px-2 py-2 text-sm font-medium transition">
                        Logout
                    </button>
                </div>
            </header>

            <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamically injected DB cards go here -->
            </div>
        </div>
    </div>

    <!-- =========================================
         3. PROJECT MODAL 
         ========================================= -->
    <div id="project-modal" class="fixed inset-0 bg-black/70 hidden flex justify-center items-center backdrop-blur-sm z-50">
        <div class="bg-gray-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-gray-700">
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold text-white">Add Project Note</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl font-bold leading-none">&times;</button>
            </div>
            
            <form id="project-form" onsubmit="saveProject(event)" class="p-6">
                <input type="hidden" id="project-id">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-400 mb-1">Repository Name</label>
                    <input type="text" id="repoName" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Priority</label>
                        <select id="priorityLevel" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                            <option>High</option>
                            <option selected>Medium</option>
                            <option>Low</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Status</label>
                        <select id="status" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                            <option selected>Backlog</option>
                            <option>In Progress</option>
                            <option>Completed</option>
                        </select>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-400 mb-1">Private Notes</label>
                    <textarea id="privateNotes" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white hover:bg-gray-700 transition">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-md transition">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <script src="src/index.js"></script>
</body>
</html>
